<!-- CarbonWeb App Icons — Markup Examples -->

<!-- Default (md, 64px) -->
<div class="app-icon">
  <img src="/logos/services/workflow-icon-color.svg" alt="Workflow" />
</div>

<!-- Small (40px) -->
<div class="app-icon app-icon--sm">
  <img src="/logos/services/creative-icon-color.svg" alt="Creative" />
</div>

<!-- Large (96px) -->
<div class="app-icon app-icon--lg">
  <img src="/logos/global-icon.svg" alt="CarbonWeb" />
</div>

<!-- Inline SVG logo -->
<div class="app-icon">
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Integration">
    <circle cx="12" cy="12" r="10" fill="#00B0C2"/>
    <text x="12" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">A</text>
  </svg>
</div>

<!-- Grid of integrations -->
<div class="app-icon-grid">
  <div class="app-icon"><img src="/logos/global-icon.svg" alt="CarbonWeb" /></div>
  <div class="app-icon"><img src="/logos/services/workflow-icon-color.svg" alt="Workflow" /></div>
  <div class="app-icon"><img src="/logos/services/creative-icon-color.svg" alt="Creative" /></div>
</div>
