<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Icons — CarbonWeb DS</title>
  <link rel="stylesheet" href="../../tokens/colors.css" />
  <link rel="stylesheet" href="../../tokens/typography.css" />
  <link rel="stylesheet" href="../../tokens/radii.css" />
  <link rel="stylesheet" href="app-icons.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); background: #fff; color: var(--color-ink); padding: 48px 60px; -webkit-font-smoothing: antialiased; }
    h2 { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
    .desc { font-size: 15px; color: var(--color-muted); margin-bottom: 32px; }
    .section { margin-bottom: 36px; }
    .section h3 { font-size: 18px; font-weight: 600; margin-bottom: 14px; }
    .label { font-size: 13px; color: var(--color-muted); margin-bottom: 10px; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; }
    .app-icon-grid { max-width: 560px; }
  </style>
</head>
<body>

<h2>App Icons</h2>
<p class="desc">Hexagonal containers for integration logos. Three sizes plus a responsive grid wrapper. Placeholder logos shown.</p>

<div class="section">
  <h3>Sizes</h3>
  <div class="row">
    <div class="app-icon app-icon--sm" tabindex="0">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="App S">
        <circle cx="12" cy="12" r="10" fill="#00B0C2"/>
        <text x="12" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Raleway, sans-serif">S</text>
      </svg>
    </div>
    <div class="app-icon" tabindex="0">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="App M">
        <circle cx="12" cy="12" r="10" fill="#69D757"/>
        <text x="12" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Raleway, sans-serif">M</text>
      </svg>
    </div>
    <div class="app-icon app-icon--lg" tabindex="0">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="App L">
        <circle cx="12" cy="12" r="10" fill="#FFB400"/>
        <text x="12" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Raleway, sans-serif">L</text>
      </svg>
    </div>
  </div>
</div>

<div class="section">
  <h3>Integration Grid</h3>
  <p class="label">.app-icon-grid — auto-fill grid, 16px gap. Hover an icon: scale 1.08 + shadow.</p>
  <div class="app-icon-grid">
    <div class="app-icon" tabindex="0">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Alpha">
        <circle cx="12" cy="12" r="10" fill="#00B0C2"/>
        <text x="12" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Raleway, sans-serif">A</text>
      </svg>
    </div>
    <div class="app-icon" tabindex="0">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Beta">
        <circle cx="12" cy="12" r="10" fill="#25BCB2"/>
        <text x="12" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Raleway, sans-serif">B</text>
      </svg>
    </div>
    <div class="app-icon" tabindex="0">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gamma">
        <circle cx="12" cy="12" r="10" fill="#FCA29D"/>
        <text x="12" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Raleway, sans-serif">G</text>
      </svg>
    </div>
    <div class="app-icon" tabindex="0">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Delta">
        <circle cx="12" cy="12" r="10" fill="#832C2F"/>
        <text x="12" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Raleway, sans-serif">D</text>
      </svg>
    </div>
    <div class="app-icon" tabindex="0">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Epsilon">
        <circle cx="12" cy="12" r="10" fill="#B08300"/>
        <text x="12" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Raleway, sans-serif">E</text>
      </svg>
    </div>
    <div class="app-icon" tabindex="0">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zeta">
        <circle cx="12" cy="12" r="10" fill="#69D757"/>
        <text x="12" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="Raleway, sans-serif">Z</text>
      </svg>
    </div>
  </div>
</div>

</body>
</html>
