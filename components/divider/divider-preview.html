<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Divider -- CarbonWeb DS</title>
  <link rel="stylesheet" href="../../tokens/colors.css" />
  <link rel="stylesheet" href="../../tokens/typography.css" />
  <link rel="stylesheet" href="divider.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); background: #fff; color: var(--color-ink); padding: 48px 60px; -webkit-font-smoothing: antialiased; }
    h2 { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
    .desc { font-size: 15px; color: var(--color-muted); margin-bottom: 32px; }
    .sub { margin-bottom: 36px; }
    .sub h3 { font-size: 18px; font-weight: 600; margin-bottom: 14px; }
    .label { font-size: 13px; font-weight: 500; color: var(--color-slate-light); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    .sample { max-width: 560px; }
  </style>
</head>
<body>

<h2>Dividers</h2>
<p class="desc">Horizontal rules to separate content sections. Default, thick, teal, gradient, and text variants.</p>

<div class="sub">
  <div class="sample">
    <div class="label">Default</div>
    <hr class="divider" />

    <div class="label">Thick</div>
    <hr class="divider divider--thick" />

    <div class="label">Teal</div>
    <hr class="divider divider--teal" />

    <div class="label">Gradient (Global)</div>
    <hr class="divider divider--gradient" />

    <div class="label">With text</div>
    <div class="divider divider--text">
      <span class="divider__text">Or continue with</span>
    </div>

    <div style="margin-top: 32px;"></div>
    <div class="label">With text (alternate label)</div>
    <div class="divider divider--text">
      <span class="divider__text">Section 2</span>
    </div>
  </div>
</div>

</body>
</html>
