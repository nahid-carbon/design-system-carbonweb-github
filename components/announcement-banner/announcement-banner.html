<!-- CarbonWeb Announcement Banner -- Markup Examples -->

<!-- Teal (default) -->
<div class="announcement-banner" data-banner-id="promo-teal">
  <span class="announcement-banner__text">
    New feature released! Check out our latest workflow automations.
    <a href="#" class="announcement-banner__link">Learn more</a>
  </span>
  <button class="announcement-banner__close" aria-label="Dismiss banner">
    <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" width="20" height="20">
      <path d="M15 5L5 15M5 5l10 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </button>
</div>
