<!-- Monday Partner Card — CarbonWeb Design System -->
<!-- Trust/credibility section with stats counters and logo marquee -->
<!-- Include monday-partner-card.js for WebGL fluid gradient shine (CSS blobs are the no-JS/no-WebGL fallback) -->
<!-- Variants:
     default                              — ambient fluid shine (speed 0.55)
     monday-partner-card--interactive     — faster flow (1.0), cursor bends field, clicks spawn ripples
     e.g. <div class="monday-partner-card monday-partner-card--interactive"> ... same children ... </div> -->

<div class="monday-partner-card">
  <!-- Animated shine blobs (6 elements: 5 corner blobs + 1 light sweep) -->
  <div class="monday-partner-card__shine" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>

  <h2 class="monday-partner-card__heading">A trusted monday.com partner</h2>
  <p class="monday-partner-card__description">
    CarbonWeb has experience in all things monday.com, from implementation
    and training, to custom workflow and make.com integration.
  </p>

  <div class="monday-partner-card__stats">
    <div class="monday-partner-card__stat">
      <div class="monday-partner-card__stat-value">30k+</div>
      <div class="monday-partner-card__stat-label">Hours of Professional Service</div>
    </div>
    <div class="monday-partner-card__stat">
      <div class="monday-partner-card__stat-value">60+</div>
      <div class="monday-partner-card__stat-label">Industries Served</div>
    </div>
    <div class="monday-partner-card__stat">
      <div class="monday-partner-card__stat-value">55+</div>
      <div class="monday-partner-card__stat-label">monday.com experts</div>
    </div>
  </div>

  <div class="monday-partner-card__marquee">
    <div class="monday-partner-card__marquee-track">
      <!-- Group 1 -->
      <div class="monday-partner-card__marquee-group">
        <img src="logos/abbvie-logo.png" alt="Abbvie">
        <img src="logos/celsius-logo.png" alt="Celsius">
        <img src="logos/david-yurman-logo.png" alt="David Yurman">
        <img src="logos/tiktok-logo.png" alt="TikTok">
        <img src="logos/zippo-logo.png" alt="Zippo">
        <img src="logos/feastables-logo.png" alt="Feastables">
        <img src="logos/rocket-logo.png" alt="Rocket">
        <img src="logos/weichert-logo.png" alt="Weichert">
        <img src="logos/sisu-logo.png" alt="Sisu">
        <img src="logos/woolpert-logo.png" alt="Woolpert">
        <img src="logos/morrison-logo.png" alt="Morrison">
        <img src="logos/brightstarcare-logo.png" alt="BrightStar Care">
      </div>
      <!-- Group 2 (duplicate for seamless loop) -->
      <div class="monday-partner-card__marquee-group" aria-hidden="true">
        <img src="logos/abbvie-logo.png" alt="Abbvie">
        <img src="logos/celsius-logo.png" alt="Celsius">
        <img src="logos/david-yurman-logo.png" alt="David Yurman">
        <img src="logos/tiktok-logo.png" alt="TikTok">

        <img src="logos/weichert-logo.png" alt="Weichert">
        <img src="logos/sisu-logo.png" alt="Sisu">
        <img src="logos/woolpert-logo.png" alt="Woolpert">
        <img src="logos/morrison-logo.png" alt="Morrison">
        <img src="logos/brightstarcare-logo.png" alt="BrightStar Care">
      </div>
      <!-- Group 3 (extra for wide viewports) -->
      <div class="monday-partner-card__marquee-group" aria-hidden="true">
        <img src="logos/abbvie-logo.png" alt="Abbvie">
        <img src="logos/celsius-logo.png" alt="Celsius">
