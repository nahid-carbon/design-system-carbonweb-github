<!-- CarbonWeb Button — All variants, sizes, shapes, and states -->

<!-- ═══ PRIMARY ═══ -->

<!-- Primary Teal — Label only -->
<button class="btn btn--primary btn--teal btn--lg">Large Button</button>
<button class="btn btn--primary btn--teal btn--sm">Small Button</button>

<!-- Primary Teal — Leading icon -->
<button class="btn btn--primary btn--teal btn--lg btn--icon-left">
  <span class="btn__icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12H19M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  Large Button
</button>

<!-- Primary Teal — Trailing icon -->
<button class="btn btn--primary btn--teal btn--lg btn--icon-right">
  Large Button
  <span class="btn__icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12H19M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
</button>

<!-- Primary Teal — Icon only -->
<button class="btn btn--primary btn--teal btn--lg btn--icon-only" aria-label="Next">
  <span class="btn__icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12H19M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
</button>

<!-- Primary Teal — Loading -->
<button class="btn btn--primary btn--teal btn--lg btn--icon-only btn--loading" disabled aria-busy="true" aria-label="Loading">
  <span class="btn__icon btn__spinner"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
</button>

<!-- Primary Green -->
<button class="btn btn--primary btn--green btn--lg">Large Button</button>

<!-- Primary White (on dark bg) -->
<button class="btn btn--primary btn--white btn--lg">Large Button</button>

<!-- Primary Grey -->
<button class="btn btn--primary btn--grey btn--lg">Large Button</button>

<!-- Primary Ink -->
<button class="btn btn--primary btn--ink btn--lg">Large Button</button>

<!-- ═══ SECONDARY ═══ -->

<!-- Secondary Teal -->
<button class="btn btn--secondary btn--teal btn--lg">Large Button</button>

<!-- Secondary Teal — Leading icon -->
<button class="btn btn--secondary btn--teal btn--lg btn--icon-left">
  <span class="btn__icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12H19M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  Large Button
</button>

<!-- Secondary Teal — Trailing icon -->
<button class="btn btn--secondary btn--teal btn--lg btn--icon-right">
  Large Button
  <span class="btn__icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12H19M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
</button>

<!-- Secondary Teal — Icon only -->
<button class="btn btn--secondary btn--teal btn--lg btn--icon-only" aria-label="Next">
  <span class="btn__icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12H19M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
</button>

<!-- Secondary Ink -->
<button class="btn btn--secondary btn--ink btn--lg">Large Button</button>

<!-- ═══ TERTIARY ═══ -->

<button class="btn btn--tertiary btn--teal">Large Button</button>
<button class="btn btn--tertiary btn--green">Large Button</button>
<button class="btn btn--tertiary btn--ink">Large Button</button>

<!-- ═══ SQUARE ═══ -->

<button class="btn btn--square btn--teal btn--lg">Large Button</button>
<button class="btn btn--square btn--teal btn--sm">Small Button</button>

<!-- ═══ DISABLED ═══ -->

<button class="btn btn--primary btn--teal btn--lg" disabled>Disabled</button>
<button class="btn btn--secondary btn--teal btn--lg" disabled>Disabled</button>
