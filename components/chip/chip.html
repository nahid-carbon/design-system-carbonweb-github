<!-- CarbonWeb Chip — Markup Examples -->

<!-- ══ Base chip ══ -->

<!-- Solid (default) -->
<button class="chip">Automations</button>

<!-- Light -->
<button class="chip chip--light">Dashboards</button>

<!-- Outline -->
<button class="chip chip--outline">Integrations</button>

<!-- Selected -->
<button class="chip chip--selected" aria-pressed="true">Workflows</button>

<!-- With leading icon (16px) -->
<button class="chip chip--outline">
  <span class="chip__icon">
    <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M13.333 4L6 11.333 2.667 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </span>
  Verified
</button>

<!-- Chip row (toggleable filter group) — requires chip.js -->
<div class="chip-row" data-toggle>
  <button class="chip chip--outline" aria-pressed="false">CRM</button>
  <button class="chip chip--outline chip--selected" aria-pressed="true">Work Management</button>
  <button class="chip chip--outline" aria-pressed="false">Dev</button>
  <button class="chip chip--outline" aria-pressed="false">Service</button>
</div>

<!-- ══ Filter chip (Figma: Chip/Filter 689:21718) ══
     Style=Light is the default. Add .chip--dark on dark sections. -->

<!-- Style=Light -->
<div class="chip-row" data-toggle>
  <button class="chip chip--filter chip--selected" aria-pressed="true">All</button>
  <button class="chip chip--filter" aria-pressed="false">monday.com</button>
  <button class="chip chip--filter" aria-pressed="false">Integrations</button>
  <button class="chip chip--filter" aria-pressed="false">Process automation</button>
</div>

<!-- Style=Dark, on the dark filter row (Figma: Chip/Filter Row 690:4) -->
<div class="chip-row chip-row--dark" data-toggle>
  <button class="chip chip--filter chip--dark chip--selected" aria-pressed="true">All</button>
  <button class="chip chip--filter chip--dark" aria-pressed="false">monday.com</button>
  <button class="chip chip--filter chip--dark" aria-pressed="false">Integrations</button>
  <button class="chip chip--filter chip--dark" aria-pressed="false">Process automation</button>
</div>

<!-- ══ Blog Category tag (Figma: Chip/Blog Category 735:4410) ══ -->

<!-- Theme=Dark -->
<span class="chip chip--tag chip--category">monday.com</span>
<span class="chip chip--tag chip--category">Process automation</span>
<span class="chip chip--tag chip--category">Integrations</span>

<!-- Theme=Light -->
<span class="chip chip--tag chip--category chip--tag-light">monday.com</span>
<span class="chip chip--tag chip--category chip--tag-light">Process automation</span>
<span class="chip chip--tag chip--category chip--tag-light">Integrations</span>
