<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Field — CarbonWeb DS</title>
  <link rel="stylesheet" href="../../tokens/colors.css" />
  <link rel="stylesheet" href="../../tokens/spacing.css" />
  <link rel="stylesheet" href="../../tokens/typography.css" />
  <link rel="stylesheet" href="../../tokens/radii.css" />
  <link rel="stylesheet" href="text-field.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); background: #fff; color: var(--color-ink); padding: 48px 60px; -webkit-font-smoothing: antialiased; }
    h2 { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
    .desc { font-size: 15px; color: var(--color-muted); margin-bottom: 32px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; max-width: 700px; }
  </style>
</head>
<body>

<h2>Text Fields</h2>
<p class="desc">Input variants — default, error, disabled, floating label. (Template)</p>

<div class="grid">
  <div class="text-field">
    <label class="text-field__label" for="p-name">Full name</label>
    <input class="text-field__input" type="text" id="p-name" placeholder="Enter your name" />
  </div>

  <div class="text-field">
    <label class="text-field__label" for="p-email">Email</label>
    <input class="text-field__input" type="email" id="p-email" placeholder="example@gmail.com" />
    <p class="text-field__helper">We'll never share your email.</p>
  </div>

  <div class="text-field text-field--error">
    <label class="text-field__label" for="p-err">Email (error)</label>
    <input class="text-field__input" type="email" id="p-err" value="not-an-email" aria-invalid="true" aria-describedby="p-err-msg" />
    <p class="text-field__error-msg" id="p-err-msg">Please enter a valid email address.</p>
  </div>

  <div class="text-field text-field--disabled">
    <label class="text-field__label" for="p-dis">Disabled</label>
    <input class="text-field__input" type="text" id="p-dis" placeholder="Cannot edit" disabled />
  </div>

  <div class="text-field text-field--floating">
    <input class="text-field__input" type="text" id="p-float" placeholder=" " />
    <label class="text-field__label" for="p-float">Floating label</label>
  </div>
</div>

<script src="text-field.js"></script>
</body>
</html>
