<!-- CarbonWeb Counter — Markup Examples -->

<!-- 1. Basic counter -->
<div class="counter">
  <div class="counter__value">
    <span class="counter__number" data-to="250">0</span>
  </div>
  <p class="counter__title">Projects Completed</p>
</div>

<!-- 2. Counter with prefix -->
<div class="counter">
  <div class="counter__value">
    <span class="counter__prefix">$</span>
    <span class="counter__number" data-to="5">0</span>
  </div>
  <p class="counter__title">Million Revenue Generated</p>
</div>

<!-- 3. Counter with suffix -->
<div class="counter">
  <div class="counter__value">
    <span class="counter__number" data-to="10">0</span>
    <span class="counter__suffix">k+</span>
  </div>
  <p class="counter__title">Hours of Professional Service</p>
</div>

<!-- 4. Teal colored counter -->
<div class="counter counter--teal">
  <div class="counter__value">
    <span class="counter__number" data-to="98">0</span>
    <span class="counter__suffix">%</span>
  </div>
  <p class="counter__title">Client Satisfaction Rate</p>
</div>

<!-- 5. Green colored counter -->
<div class="counter counter--green">
  <div class="counter__value">
    <span class="counter__number" data-to="20">0</span>
    <span class="counter__suffix">+</span>
  </div>
  <p class="counter__title">monday.com Experts</p>
</div>

<!-- 6. Group of 3 counters with dividers -->
<div class="counter-group counter-group--dividers">

  <div class="counter counter--teal">
    <div class="counter__value">
      <span class="counter__number" data-to="10">0</span>
      <span class="counter__suffix">k+</span>
    </div>
    <p class="counter__title">Hours of Professional Service</p>
  </div>

  <div class="counter counter--teal">
    <div class="counter__value">
      <span class="counter__number" data-to="15">0</span>
      <span class="counter__suffix">+</span>
    </div>
    <p class="counter__title">Industries Served</p>
  </div>

  <div class="counter counter--teal">
    <div class="counter__value">
      <span class="counter__number" data-to="20">0</span>
      <span class="counter__suffix">+</span>
    </div>
    <p class="counter__title">monday.com Experts</p>
  </div>

</div>
