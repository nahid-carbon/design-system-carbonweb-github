<!-- CarbonWeb Badge — Markup Examples -->

<!-- Solid variants -->
<span class="badge badge--teal">Teal</span>
<span class="badge badge--green">Green</span>
<span class="badge badge--yellow">Yellow</span>
<span class="badge badge--pink">Pink</span>
<span class="badge badge--ink">Ink</span>

<!-- With dot indicator -->
<span class="badge badge--teal"><span class="badge__dot"></span>Active</span>
<span class="badge badge--green"><span class="badge__dot"></span>Complete</span>
<span class="badge badge--yellow"><span class="badge__dot"></span>Pending</span>
<span class="badge badge--pink"><span class="badge__dot"></span>Error</span>
<span class="badge badge--ink"><span class="badge__dot"></span>Archived</span>

<!-- With icon -->
<span class="badge badge--teal">
  <span class="badge__icon">
    <svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M11.667 3.5L5.25 9.917 2.333 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </span>
  Verified
</span>
<span class="badge badge--pink">
  <span class="badge__icon">
    <svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="7" cy="7" r="5.25" stroke="currentColor" stroke-width="1.5"/>
      <path d="M7 4.667V7M7 9.333h.006" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </span>
  Warning
</span>

<!-- Outline variants -->
<span class="badge badge--outline badge--teal">Teal Outline</span>
<span class="badge badge--outline badge--green">Green Outline</span>
<span class="badge badge--outline badge--yellow">Yellow Outline</span>
<span class="badge badge--outline badge--pink">Pink Outline</span>
<span class="badge badge--outline badge--ink">Ink Outline</span>

<!-- Outline with dot -->
<span class="badge badge--outline badge--teal"><span class="badge__dot"></span>Active</span>
<span class="badge badge--outline badge--green"><span class="badge__dot"></span>Complete</span>
<span class="badge badge--outline badge--pink"><span class="badge__dot"></span>Error</span>
