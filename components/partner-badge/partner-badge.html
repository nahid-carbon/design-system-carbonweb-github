<!-- CarbonWeb Partner Badge — Markup Examples
     Official monday.com partner lockups, exported from Figma as SVG.
     Size by height; width follows the badge's own aspect ratio. -->

<!-- Platinum Partner, borderless (Figma 439:101) — the default lockup -->
<a class="partner-badge" href="https://monday.com/partners" target="_blank" rel="noopener">
  <img class="partner-badge__img" src="assets/badge-platinum-partner.svg"
       alt="monday.com Platinum Partner" />
</a>

<!-- Platinum Partner, bordered (Figma 527:6235) — use on busy or tinted surfaces -->
<a class="partner-badge" href="#">
  <img class="partner-badge__img" src="assets/badge-platinum-partner-bordered.svg"
       alt="monday.com Platinum Partner" />
</a>

<!-- Advanced Delivery Partner (Figma 439:100) -->
<a class="partner-badge" href="#">
  <img class="partner-badge__img" src="assets/badge-advanced-delivery-partner.svg"
       alt="monday.com Advanced Delivery Partner" />
</a>

<!-- Solutions Partner (Figma 395:6827) -->
<a class="partner-badge" href="#">
  <img class="partner-badge__img" src="assets/badge-solutions-partner.svg"
       alt="monday.com Solutions Partner" />
</a>

<!-- Channel Partner (Figma 395:6826) -->
<a class="partner-badge" href="#">
  <img class="partner-badge__img" src="assets/badge-channel-partner.svg"
       alt="monday.com Channel Partner" />
</a>

<!-- Non-interactive (credential shown, not linked) -->
<span class="partner-badge partner-badge--sm">
  <img class="partner-badge__img" src="assets/badge-platinum-partner.svg"
       alt="monday.com Platinum Partner" />
</span>

<!-- Sizes: --sm 40px, --md 56px (default), --lg 72px -->
<span class="partner-badge partner-badge--lg">
  <img class="partner-badge__img" src="assets/badge-advanced-delivery-partner.svg"
       alt="monday.com Advanced Delivery Partner" />
</span>

<!-- Row — e.g. the credential pair above a hero headline -->
<div class="partner-badge-row">
  <span class="partner-badge partner-badge--sm">
    <img class="partner-badge__img" src="assets/badge-platinum-partner.svg"
         alt="monday.com Platinum Partner" />
  </span>
  <span class="partner-badge partner-badge--sm">
    <img class="partner-badge__img" src="assets/badge-advanced-delivery-partner.svg"
         alt="monday.com Advanced Delivery Partner" />
  </span>
</div>
