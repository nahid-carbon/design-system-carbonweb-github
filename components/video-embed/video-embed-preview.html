<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Embed — CarbonWeb DS</title>
  <link rel="stylesheet" href="../../tokens/colors.css" />
  <link rel="stylesheet" href="../../tokens/spacing.css" />
  <link rel="stylesheet" href="../../tokens/typography.css" />
  <link rel="stylesheet" href="../../tokens/radii.css" />
  <link rel="stylesheet" href="../../tokens/shadows.css" />
  <link rel="stylesheet" href="video-embed.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-family); background: #f5f5f5; color: var(--color-ink); padding: 48px 60px; -webkit-font-smoothing: antialiased; }
    h2.page-title { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
    .desc { font-size: 15px; color: var(--color-muted); margin-bottom: 32px; }
    .section { margin-bottom: 56px; }
    .section__title { font-size: 20px; font-weight: 600; color: var(--color-ink); margin-bottom: 20px; }
    .panel { background: #ffffff; border-radius: 12px; padding: 48px; }
  </style>
</head>
<body>

<h2 class="page-title">Video Embed</h2>
<p class="desc">Centered video block — gradient poster with play button, iframe loads on click.</p>

<div class="section">
  <p class="section__title">Default</p>
  <div class="panel">
    <div class="video-embed" data-video-embed>
      <h2 class="video-embed__heading">See CarbonWeb in action</h2>
      <p class="video-embed__desc">A two-minute walkthrough of how we design, build, and launch custom workflows for teams like yours.</p>
      <div class="video-embed__frame">
        <button class="video-embed__poster" data-src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1" aria-label="Play video: See CarbonWeb in action">
          <span class="video-embed__play"><span class="video-embed__play-triangle"></span></span>
        </button>
      </div>
      <p class="video-embed__caption">2 min overview · Recorded with the CarbonWeb delivery team</p>
    </div>
  </div>
</div>

<script src="video-embed.js"></script>
</body>
</html>
